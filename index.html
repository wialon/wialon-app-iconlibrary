<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Icon Library</title>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge, chrome=1, requiresActiveX=true" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="640" />
    <meta name="viewport" content="width=640,target-densitydpi=320" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="cleartype" content="on" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/main.css">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script>
      var availableLanguages=null;
      var documentationLink=null;
      var is_white=null;
      var APP_CONFIG = {};
      function appPredefineVariables(app_langs,doc_link,is_whitelabeled,config){
        availableLanguages=app_langs;
        documentationLink=is_whitelabeled?(config.help_url_link ? decodeURIComponent(config.help_url_link) : null):doc_link;
        is_white=is_whitelabeled;
        APP_CONFIG=config
      }
    </script>
</head>
<body>
    <div id="iconlibrary" class="application"></div>
    <script type="text/tpl" id="throw-tpl">
        <div class="modal throw-tpl" role="dialog" data-backdrop="static" data-keyboard="false" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">
                            <span aria-hidden="true">&times;</span>
                            <span class="sr-only">{{ __("Cancel") }}</span>
                        </button>
                        <h4 class="modal-title clip">{{ __("Caution") }}!</h4>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-lg-12 col-md-12">
                                <h5>{{ message }} ({{ code }})</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
    <script type="text/tpl" id="app-tpl">
        <header class="navbar" id="header">
            <div class="row block">
                <div class="col-lg-12 col-md-12">
                    <img src="{{ host }}img/logo.svg" alt="{{ __("Icon Library") }}" height="32" width="32" class="app-logo" />
                    <span class="app-name">{{ __("Icon Library") }}</span>
                </div>
            </div>
        </header>
        <main>
            <div class="row block panel">
                <div class="col-lg-12 col-md-12 vertical-buffer">
                    <div id="source" class="btn-group">
                        <button data-source="unit" type="button" class="btn btn-sm btn-default btn-units">{{ __("Unit") }}</button>
                        <button data-source="group" type="button" class="btn btn-sm btn-default btn-groups">{{ __("Unit Group") }}</button>
                        <button data-source="poi" type="button" class="btn btn-sm btn-default btn-pois">{{ __("Geofence") }}</button>
                    </div>
                    <div class="pull-right">
                        <label class="btn btn-sm btn-action btn-add-file" for="upload">
                            {{ __("Upload Icon") }}
                            <input id="upload" name="item-file-input[]" type="file" accept="image/*" multiple />
                        </label>
                    </div>
                </div>
            </div>
            <div id="mainarea" class="col-lg-12 col-md-12 main block">
                <div id="icons" class="icons col-lg-4 col-md-3"></div>
                <div id="target" class="target col-lg-8 col-md-9"></div>
            </div>
        </main>
    </script>
    <script type="text/tpl" id="assign-tpl">
        <h3>{{ __("Assign icon to objects") }}</h3>
        <div class="filter">
            [% if ( resources !== null ) { %]
                <div class="datalist">
                    <select id="resource-list"></select>
                    <input id="resource" type="hidden" value="0" />
                </div>
            [% } %]
            <input id="filter" class="filter__input" type="text" placeholder="{{ __("Search by name") }}" />
            <button id="check" type="button" class="btn btn-sm btn-action btn-inverse btn-check"><em>{{ __("Select all") }}</em><em>{{ __("Unselect all") }}</em></button>
        </div>
        <div id="scrollArea" class="clusterize-scroll">
            <div id="contentArea" class="clusterize-content">
                <div class="clusterize-no-data"></div>
            </div>
        </div>
        <div class="buttons">
            <label class="checkbox">
                <input id="apply" type="checkbox" />
                {{ __("Replace all duplicate icons") }}
            </label>
            <button id="cancel" type="button" class="btn btn-sm btn-action btn-inverse">{{ __("Cancel") }}</button>
            <button id="submit" type="button" class="btn btn-sm btn-action btn-submit">{{ __("Apply") }}</button>
        </div>
    </script>
    <script type="text/tpl" id="similar-tpl">
        <div class="modal similar-tpl" role="dialog" data-backdrop="static" data-keyboard="false" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal">
                            <span aria-hidden="true">&times;</span>
                            <span class="sr-only">{{ __("Cancel") }}</span>
                        </button>
                        <h4 class="modal-title clip">{{ __("Apply to objects") }}</h4>
                    </div>
                    <div class="modal-body">
                        <div id="similarScrollArea" class="clusterize-scroll similar">
                            <div id="similarContentArea" class="clusterize-content">
                                <div class="clusterize-no-data"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <div class="buttons">
                            <button type="button" class="btn btn-sm btn-action btn-inverse" data-dismiss="modal">{{ __('Cancel') }}</button>
                            <button id="similar-btn" type="button" class="btn btn-sm btn-action">{{ __('OK') }}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>
    <script data-main="js/main" src="bower_components/requirejs/require.js"></script>
</body>
</html>
